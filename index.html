<!-- @dsCard group="Website" viewport="1280x860" name="Kovalivskyi — Redesigned site" subtitle="Full landing page with sticky pill nav, hero and trust strip" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ковалівський — Hausmeister &amp; Handwerksservice</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin: 0; background: var(--bg); }
  a { text-decoration: none; }
  /* Warm map tint — matches site clay/beige palette. Only tiles, not markers. */
  .area-map .leaflet-tile-pane { filter: grayscale(0.55) sepia(0.22) saturate(0.85) brightness(1.06) contrast(0.95); }
  .proj-item { transition: transform .2s ease, box-shadow .2s ease; }
  .proj-item:hover { transform: scale(1.03); box-shadow: 0 8px 28px rgba(0,0,0,0.18); }
  .proj-item:hover .proj-item-img { filter: brightness(0.82); transition: filter .2s ease; }
  .proj-item-img { transition: filter .2s ease; }
  .nav-links a:hover { color: var(--primary); }
  /* modal */
  .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(14,11,8,0.55); backdrop-filter: blur(4px);
    display: grid; place-items: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .24s var(--ease-out); }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .modal { width: min(720px, 100%); background: var(--surface); border-radius: var(--radius-xl);
    box-shadow: var(--shadow-xl); overflow: hidden; transform: translateY(12px) scale(.98);
    transition: transform .28s var(--ease-out); }
  .overlay.open .modal { transform: none; }

  /* mobile drawer */
  .mobile-drawer { position: fixed; inset: 0; top: 0; z-index: 49; background: rgba(14,11,8,0.45);
    backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .24s var(--ease-out); }
  .mobile-drawer[data-open="true"] { opacity: 1; pointer-events: auto; }
  .mobile-sheet { position: absolute; top: 90px; left: 16px; right: 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-xl);
    padding: 18px 22px 24px; transform: translateY(-12px); opacity: 0; transition: transform .28s var(--ease-out), opacity .28s var(--ease-out); }
  .mobile-drawer[data-open="true"] .mobile-sheet { transform: none; opacity: 1; }
  .mobile-sheet nav a:last-child { border-bottom: none !important; }

  @media (max-width: 1180px) {
    .nav-links, .header-cta { display: none !important; }
    .menu-btn { display: grid !important; }
  }
  @media (max-width: 980px) {
    .area-map { height: 720px !important; }
    .area-panel { top: auto !important; left: 40px !important; right: 40px !important; bottom: 36px !important; max-width: none !important; }
    .hero-grid, .about-grid, .contact-grid { grid-template-columns: 1fr !important; }
    .trust-grid, .proc-grid { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
    .serv-illus, .serv-grid, .rev-grid { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
    .proj-masonry { column-count: 2 !important; }
    .hero-grid > div:first-child { order: 1 !important; }
    .hero-grid > div:last-child { order: 2 !important; }
  }
  @media (min-width: 1181px) {
    .mobile-drawer { display: none !important; }
  }
  @media (max-width: 768px) {
    .proc-grid { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
  }
  @media (max-width: 560px) {
    .area-map { height: 780px !important; }
    .area-panel { left: 24px !important; right: 24px !important; bottom: 28px !important; padding: 30px 26px !important; }
    .serv-illus, .serv-grid, .rev-grid, .trust-grid, .proc-grid { grid-template-columns: minmax(0,1fr) !important; }
    .hero-grid > div:first-child { padding-top: 8px !important; }
    .hero-cta { flex-direction: column; align-items: stretch; }
    .hero-cta > a, .hero-cta > button { width: 100% !important; display: block !important; }
    .hero-cta > a > * { width: 100% !important; display: block !important; }
    .proj-grid { grid-template-columns: minmax(0,1fr) !important; }
    .hero-badge { left: 0 !important; }
    .overlay { padding: 0 !important; }
    .modal { border-radius: 0 !important; max-height: 100vh; overflow-x: hidden; }
    .qw-service-grid { grid-template-columns: 1fr !important; }
    .qw-obj-grid, .qw-urg-grid { grid-template-columns: 1fr !important; }
    .qw-step-label { display: none !important; }
    #contact > div { padding-left: 0 !important; padding-right: 0 !important; }
    #contact > div > div:first-child { padding-left: 24px !important; padding-right: 24px !important; }
    #contact > div > div:last-child { border-radius: 0 !important; }
    .qw-footer { flex-direction: column-reverse !important; padding: 16px !important; }
    .qw-footer-btns { width: 100% !important; }
    .qw-footer-btns > * { flex: 1 !important; }
  }
</style>
</head>
<body style="font-size: 16px">
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#F6F2EA"/>
    <rect x="30" y="30" width="40" height="40" rx="11" fill="#1C140F"/>
    <text x="50" y="64" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#FCFAF4" text-anchor="middle">К</text>
  </svg>
</template>
<div id="root"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./_ds_bundle.js?v=11"></script>
<script type="text/babel" data-presets="react" src="icons.jsx"></script>
<script type="text/babel" data-presets="react" src="quote-wizard.jsx"></script>
<script type="text/babel" data-presets="react" src="site-top.jsx"></script>
<script type="text/babel" data-presets="react" src="site-bottom.jsx"></script>
<script type="text/babel" data-presets="react">
const { SiteHeader, Hero, TrustStrip, About, Services, ServiceRange, Process, Projects, Reviews, ServiceArea, Faq, ContactBooking, SiteFooter, QuoteWizard } = window;

function App() {
  const [open, setOpen] = React.useState(false);
  const quote = () => setOpen(true);
  React.useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && setOpen(false);
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  return (
    <div>
      <SiteHeader onQuote={quote} />
      <Hero onQuote={quote} />
      <TrustStrip />
      <About />
      <Services />
      <ServiceRange />
      <Process />
      <Projects />
      <Reviews />
      <ServiceArea />
      <Faq />
      <ContactBooking>
        <QuoteWizard embedded />
      </ContactBooking>
      <SiteFooter />

      <div className={'overlay' + (open ? ' open' : '')} onClick={(e) => e.target === e.currentTarget && setOpen(false)}>
        <div className="modal">
          {open && <QuoteWizard onClose={() => setOpen(false)} />}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
